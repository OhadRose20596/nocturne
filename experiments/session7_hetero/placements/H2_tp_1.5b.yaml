# H2: TP 1.5b across Mac and CUDA, one group, 6 heads each (mixed devices accepted on purpose)
model: qwen2.5-1.5b-bf16
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
allow_mixed_devices: true
stages:
  - name: s0
    layers: [0, 28]
    embed: true
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50070, heads: 6}
      - {host: pc, device: cuda, port: 50070, heads: 6}
