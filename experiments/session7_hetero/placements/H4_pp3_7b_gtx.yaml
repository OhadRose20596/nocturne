# H4: PP 7b over three machines: layers 0-10 and embedding on the M5 mps, 10-19 on the Air mps, 19-28 and head on gtx cuda (GTX 1070, budget 6.0 GB)
model: qwen2.5-7b-bf16
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 10]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070}
  - name: s1
    layers: [10, 19]
    ranks:
      - {host: air, device: mps, port: 50070}
  - name: s2
    layers: [19, 28]
    lm_head: true
    ranks:
      - {host: gtx, device: cuda, port: 50070, budget_gb: 6.0}
