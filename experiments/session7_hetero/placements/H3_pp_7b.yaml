# H3: PP 7b, layers 0-22 on the M5 mps, layers 22-28 on the PC cuda (3.5 GB), head on the M5
model: qwen2.5-7b-bf16
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 22]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070}
  - name: s1
    layers: [22, 28]
    ranks:
      - {host: pc, device: cuda, port: 50070, budget_gb: 3.5}
  - name: head
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50071}
