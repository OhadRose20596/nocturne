# R2: 7B Q8_0, TP 14, 7, 7 heads over m5, air, gtx
model: ~/models/gguf/Qwen2.5-7B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
allow_mixed_devices: true
stages:
  - name: s0
    layers: [0, 28]
    embed: true
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50070, weight: 2, heads: 14}
      - {host: air, device: mps, port: 50070, weight: 1, heads: 7}
      - {host: gtx, device: cuda, port: 50070, weight: 1, heads: 7, budget_gb: 5.5}
