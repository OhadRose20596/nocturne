# R6: 32B Q8_0 hybrid: TP pair m5 and air for layers 0 to 53 with the embedding (shares 19:10), gtx stage for layers 53 to 64 and the head.
# Context 512, M5 GPU limit raised to 20 GiB (same policy as R5b). Budgets leave room for about 1.3 to 1.5 GB of MPS overhead above the plan.
model: ~/models/Qwen2.5-32B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 512
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 53]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070, weight: 19, budget_gb: 19.5}
      - {host: air, device: mps, port: 50070, weight: 10, budget_gb: 10.5}
  - name: s1
    layers: [53, 64]
    lm_head: true
    ranks:
      - {host: gtx, device: cuda, port: 50070, budget_gb: 7.2}
