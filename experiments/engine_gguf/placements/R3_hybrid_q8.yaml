# R3: 7B Q8_0 hybrid: TP pair m5 and air (layers 0 to 13), gtx stage (layers 14 to 27 and the head)
model: ~/models/gguf/Qwen2.5-7B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 14]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070}
      - {host: air, device: mps, port: 50070}
  - name: s1
    layers: [14, 28]
    lm_head: true
    ranks:
      - {host: gtx, device: cuda, port: 50070, budget_gb: 6.0}
