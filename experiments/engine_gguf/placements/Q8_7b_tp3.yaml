# C2: 7B Q8_0, tensor parallel over three ranks (10, 9, 9 heads), all on the M5 loopback
model: ~/models/gguf/Qwen2.5-7B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 28]
    embed: true
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50070}
      - {host: m5, device: mps, port: 50071}
      - {host: m5, device: mps, port: 50072}
