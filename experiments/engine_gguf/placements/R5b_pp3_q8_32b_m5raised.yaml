# R5 retry: 32B Q8_0, PP m5 0-34, air 34-53, gtx 53-64, context 512, M5 GPU limit raised to 20 GiB (iogpu.wired_limit_mb 20480, a separate policy). Air had OOM at 22 layers (MPS overhead about 1.3 GB above the plan).
# Layer shares as close to the llama.cpp row A1_wifi_qwen2.5-32b-q8_m5_c512ts3m_r1 (21, 11, 32 of 64) as the planner accepts.
model: ~/models/Qwen2.5-32B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 512
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 34]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070, budget_gb: 20.5}
  - name: s1
    layers: [34, 53]
    ranks:
      - {host: air, device: mps, port: 50070, budget_gb: 12.5}
  - name: s2
    layers: [53, 64]
    lm_head: true
    ranks:
      - {host: gtx, device: cuda, port: 50070, budget_gb: 7.2}
