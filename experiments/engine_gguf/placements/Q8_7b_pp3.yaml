# C1: 7B Q8_0, pipeline over three stages, all on the M5 loopback
model: ~/models/gguf/Qwen2.5-7B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 9]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070}
  - name: s1
    layers: [9, 19]
    ranks:
      - {host: m5, device: mps, port: 50071}
  - name: s2
    layers: [19, 28]
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50072}
