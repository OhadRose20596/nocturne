# P1: 7B TP 2 at 3:2, M5 and Air
model: qwen2.5-7b-bf16
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 28]
    embed: true
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50070, weight: 3}
      - {host: air, device: mps, port: 50070, weight: 2}
