# P3: 1.5B TP 3, two on the M5 and one on the Air
model: qwen2.5-1.5b-bf16
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 28]
    embed: true
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50070}
      - {host: m5, device: mps, port: 50071}
      - {host: air, device: mps, port: 50070}
