# Session 10 part 3, O5: 1.5B Q8_0, two contiguous stages (the comparison for the interleaved placement), M5 loopback
model: ~/models/gguf/Qwen2.5-1.5B-Instruct-Q8_0.gguf
coordinator: {host: m5}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
host_budget_gb: {m5: 12}
stages:
  - name: a0
    layers: [0, 14]
    embed: true
    ranks:
      - {host: m5, device: mps, port: 50070}
  - name: b0
    layers: [14, 28]
    lm_head: true
    ranks:
      - {host: m5, device: mps, port: 50071}
