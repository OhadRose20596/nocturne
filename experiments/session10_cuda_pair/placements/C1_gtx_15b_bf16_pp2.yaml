# Session 10 part 3, CUDA check (not an experiment row): 1.5B bf16, two contiguous stages, both rank processes on gtx (one GPU)
model: qwen2.5-1.5b-bf16
coordinator: {host: gtx}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
host_budget_gb: {gtx: 7}
stages:
  - name: a0
    layers: [0, 14]
    embed: true
    ranks:
      - {host: gtx, device: cuda, port: 50070}
  - name: b0
    layers: [14, 28]
    lm_head: true
    ranks:
      - {host: gtx, device: cuda, port: 50071}
