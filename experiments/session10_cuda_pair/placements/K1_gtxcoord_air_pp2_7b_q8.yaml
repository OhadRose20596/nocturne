# Session 10 part 1 check (not an experiment row): gtx (CUDA, WSL2) is the coordinator and planner, the Air gets its slices shipped.
model: ~/models/gguf/Qwen2.5-7B-Instruct-Q8_0.gguf
coordinator: {host: gtx}
reduce_dtype: float32
max_seq_len: 4096
prefill_max: 256
granule: 128
stages:
  - name: s0
    layers: [0, 10]
    embed: true
    ranks:
      - {host: gtx, device: cuda, port: 50070}
  - name: s1
    layers: [10, 28]
    lm_head: true
    ranks:
      - {host: air, device: mps, port: 50070}
