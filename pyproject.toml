[project]
name = "nocturne"
version = "0.1.0"
description = "Distributed LLM inference over volunteer consumer GPUs. Control plane and experiment bench."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "psutil>=5.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Row B1t only (nocturne/engines/torch_tp): a separate venv outside iCloud, e.g. ~/dev/nocturne-torch; never in the base install.
bench-torch = ["torch>=2.4", "transformers>=4.45", "safetensors>=0.4", "tokenizers>=0.20", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nocturne*"]
